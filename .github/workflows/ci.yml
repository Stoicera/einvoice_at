name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (build + Spotless + tests)
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 14

  mutation:
    name: Mutation tests (core, mapping, validation, formats-ebinterface, formats-ubl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Two steps, deliberately not one "-pl ... -am -Pmutation ...": the pitest goal is invoked
      # bare on the command line (no lifecycle-phase binding), so it runs against every project the
      # reactor selects, not just the ones with a "mutation" profile (see mapping's own pom.xml
      # comment and the exec-maven-plugin precedent in the root pom.xml). All five gated modules
      # carry the "mutation" profile (core, mapping, validation, formats-ebinterface, formats-ubl),
      # so the bare goal is safe against this explicit "-pl" list — every project it selects has its
      # own pitest wiring. It is still run WITHOUT "-am": "-am" would drag in profile-less modules
      # (e.g. app, formats-api) and the bare goal would fail on them. The install step (with "-am")
      # first puts the whole dependency closure — including mapping, which validation needs at test
      # scope — in the local repo so the second reactor resolves every inter-module edge without
      # rebuilding it.
      - name: Install dependency closure (mutation-gated modules)
        run: ./mvnw -B -ntp -pl core,mapping,validation,formats-ebinterface,formats-ubl -am install -DskipTests
      - name: PIT mutation coverage (mutation-gated modules)
        run: ./mvnw -B -ntp -pl core,mapping,validation,formats-ebinterface,formats-ubl -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

  security-scan:
    name: Security scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The NVD data set is large and slow to build from scratch. Caching it keyed on the week
      # keeps a normal run to an incremental update while still guaranteeing a full refresh at
      # least weekly, so a stale cache can never quietly hide a new advisory for long.
      - name: Cache the NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      # An unauthenticated NVD client is rate-limited hard enough that the first sync takes the
      # better part of an hour and often fails outright. Saying so here means a missing secret
      # produces an actionable message instead of a puzzling HTTP 403 deep in the plugin output.
      - name: Check for the NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY is not set. The scan will still run, but the NVD rate-limits"
            echo "::warning::unauthenticated clients severely and the sync may take ~1h or fail."
            echo "::warning::Request a free key at https://nvd.nist.gov/developers/request-an-api-key"
            echo "::warning::and add it as the repository secret NVD_API_KEY."
          fi
      - name: OWASP Dependency-Check (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Psecurity verify -DskipTests
      - name: Upload the dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
