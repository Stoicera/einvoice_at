name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (build + Spotless + tests)
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 14

  mutation:
    name: Mutation tests (core, mapping, validation, formats-ebinterface, formats-ubl, ai-assist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Two steps, deliberately not one "-pl ... -am -Pmutation ...": the pitest goal is invoked
      # bare on the command line (no lifecycle-phase binding), so it runs against every project the
      # reactor selects, not just the ones with a "mutation" profile (see mapping's own pom.xml
      # comment and the exec-maven-plugin precedent in the root pom.xml). All five gated modules
      # carry the "mutation" profile (core, mapping, validation, formats-ebinterface, formats-ubl),
      # so the bare goal is safe against this explicit "-pl" list — every project it selects has its
      # own pitest wiring. M5 adds ai-assist to that list: its scrubber and retry logic are exactly the
      # small, branch-dense, security-relevant code where line coverage alone proves little. It is still run WITHOUT "-am": "-am" would drag in profile-less modules
      # (e.g. app, formats-api) and the bare goal would fail on them. The install step (with "-am")
      # first puts the whole dependency closure — including mapping, which validation needs at test
      # scope — in the local repo so the second reactor resolves every inter-module edge without
      # rebuilding it.
      - name: Install dependency closure (mutation-gated modules)
        run: ./mvnw -B -ntp -pl core,mapping,validation,formats-ebinterface,formats-ubl,ai-assist -am install -DskipTests
      - name: PIT mutation coverage (mutation-gated modules)
        run: ./mvnw -B -ntp -pl core,mapping,validation,formats-ebinterface,formats-ubl,ai-assist -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

  security-scan:
    name: Security scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The dependency-check plugin must bind in the ROOT project only. A parent's
      # <build><plugins> is inherited by every child, so without <inherited>false</inherited> the
      # `aggregate` goal ran in all ten reactor projects; they share one CveDB, the first execution
      # closes it, and the rest fail per CVE with "connectionPool is null". That is what made this
      # job red while the diagnosis pointed at a missing NVD_API_KEY (M4 hostile review, F1).
      # Asserting it here — with the scan itself skipped, so the check costs seconds and needs no
      # NVD data — means the inheritance cannot silently come back.
      - name: Assert the scan binds once, at the root only
        run: |
          bindings=$(./mvnw -B -ntp -Psecurity verify -DskipTests \
            -Dspotless.check.skip=true -Djacoco.skip=true -Ddependency-check.skip=true \
            | grep -cE 'dependency-check:.*:aggregate \(dependency-check\)' || true)
          echo "aggregate goal bound in $bindings project(s)"
          if [ "$bindings" != "1" ]; then
            echo "::error::dependency-check must bind in exactly 1 project (the root), not $bindings."
            echo "::error::Check <inherited>false</inherited> on the plugin in the root pom.xml."
            exit 1
          fi
      # The NVD data set is large and slow to build from scratch, so it is cached — but the cache
      # is keyed on the ISO week and NOT on run id. Two reasons, both learned the hard way:
      #   * a run-id key never hits, so every run wrote a brand-new cache entry and `restore-keys`
      #     just kept restoring the newest one forever — there was no weekly refresh at all,
      #     despite the comment that used to sit here claiming there was;
      #   * a run that dies mid-sync persists its half-written H2 database, and the next run
      #     restores that corruption. A week-scoped key bounds how long such a cache can poison
      #     the job, and guarantees a genuinely full refresh at least weekly so a stale copy
      #     cannot quietly hide a new advisory.
      - name: Compute the NVD cache week
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}
          restore-keys: nvd-${{ runner.os }}-
      # Without NVD_API_KEY the sync cannot complete: the NVD rate-limits unauthenticated clients
      # so hard that the download stalls, the H2 database is left half-initialised, and the plugin
      # then NPEs per CVE. Running it anyway produces a failure that says nothing about this
      # repository's dependencies — and a stage that is permanently red for an external reason
      # teaches everyone to ignore red, which is worse than the gap it was meant to close.
      #
      # So the scan is SKIPPED, loudly, when the secret is absent: a warning annotation plus a line
      # in the job summary that nobody reviewing a run can miss. It is not silent, it is not
      # pretended, and it turns into a real gate the moment the secret exists — no workflow edit
      # needed. The binding assertion above still runs either way, so this job is never a no-op.
      - name: Check for the NVD API key
        id: nvd-key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NVD_API_KEY is not set — the OWASP Dependency-Check SCAN WAS SKIPPED."
            echo "::warning::Request a free key at https://nvd.nist.gov/developers/request-an-api-key"
            echo "::warning::and add it as the repository secret NVD_API_KEY to turn this into a real gate."
            {
              echo "## ⚠️ Security scan skipped"
              echo
              echo "\`NVD_API_KEY\` is not configured, so the NVD data sync cannot complete and the"
              echo "dependency scan **did not run**. This job did not check this repository's"
              echo "dependencies for known vulnerabilities."
              echo
              echo "Fix: add the repository secret \`NVD_API_KEY\`"
              echo "(free, from <https://nvd.nist.gov/developers/request-an-api-key>)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: OWASP Dependency-Check (fails on CVSS >= 7)
        if: steps.nvd-key.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Psecurity verify -DskipTests
      # always() so a FAILED scan still publishes its report — that is when it is most wanted — but
      # only when the scan actually ran, or the upload warns about a path that cannot exist.
      - name: Upload the dependency-check report
        if: always() && steps.nvd-key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14

  # Browser end-to-end + the validator load scenario (ENGINEERING_STANDARDS §3, M5 Abnahme "E2E grün
  # in CI"). Its own job, not part of `build`, because it pulls a Chrome image and stands up the whole
  # compose stack — the same reasoning that keeps `mutation` and `security-scan` separate.
  #
  # Deliberate consequence, stated so nobody mistakes it: a green `build` job does NOT mean the browser
  # flow works. This job is what means that.
  e2e:
    name: Browser E2E + load scenario
    runs-on: ubuntu-latest
    # The three variables docker-compose.yml declares with the `:?` form, i.e. the ones that make
    # interpolation of the whole file fail when they are absent. They live at JOB level rather than
    # on the step that starts the stack, because `docker compose down` interpolates the file too:
    # with them set only on the "up" step, the "Stop the stack" step failed with
    # "required variable POSTGRES_PASSWORD is missing a value" and took the job red AFTER every test
    # and every Gatling assertion had passed. That is what this job's first real CI run found.
    #
    # Not secrets: this stack lives for one job on an ephemeral runner and is never reachable from
    # outside it. Named to say so, so nobody promotes them to repository secrets by pattern-matching.
    env:
      POSTGRES_PASSWORD: ci-postgres-not-a-secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Guards a class of bug that is silent by construction: a variable documented in .env.example
      # that docker-compose.yml never passes to the container, so setting it in .env does nothing at
      # all. Seven of them had accumulated by M5 — including the whole RATE_LIMIT_* family — and the
      # Gatling run below is what exposed them, because raising the limit had no effect and the
      # simulation refused to report a p95 measured through a rate limiter.
      # Guards BOTH directions, because the milestone that fixed one of them left the other open
      # (M5 hostile review, F7):
      #
      #   documented -> wired    a variable in .env.example that compose never passes through does
      #                          nothing at all when set, silently. Seven had accumulated by M5,
      #                          the whole RATE_LIMIT_* family among them, and the Gatling run is
      #                          what exposed it — raising the limit had no effect.
      #   read       -> documented   a variable application.yml reads that .env.example never names
      #                          is a required setting nobody outside this repo can discover. Three
      #                          were undocumented (OAUTH2_ISSUER_URI, OAUTH2_JWK_SET_URI,
      #                          POSTGRES_HOST), and the one-directional check above could not see
      #                          them. CLAUDE.md: ".env.example stays complete and current."
      - name: Documented and actual configuration agree, in both directions
        run: |
          set -euo pipefail
          grep -oE '^[A-Z][A-Z0-9_]+=' .env.example | tr -d '=' | sort > /tmp/documented.txt
          grep -oE '\$\{[A-Z][A-Z0-9_]+' docker-compose.yml | tr -d '${' | sort -u > /tmp/wired.txt
          grep -oE '\$\{[A-Z][A-Z0-9_]+' app/src/main/resources/application.yml \
            | tr -d '${' | sort -u > /tmp/read.txt

          status=0
          unwired="$(comm -23 /tmp/documented.txt /tmp/wired.txt)"
          if [ -n "$unwired" ]; then
            echo "::error::.env.example documents variables that docker-compose.yml never passes through:"
            echo "$unwired"
            status=1
          fi
          undocumented="$(comm -13 /tmp/documented.txt /tmp/read.txt)"
          if [ -n "$undocumented" ]; then
            echo "::error::application.yml reads variables that .env.example never documents:"
            echo "$undocumented"
            status=1
          fi
          [ "$status" -eq 0 ] || exit 1
          echo "$(wc -l < /tmp/documented.txt) documented variables, all wired into compose;"
          echo "$(wc -l < /tmp/read.txt) variables read by the application, all documented."

      # Installs app (and its test-jar, which the e2e module reuses for the Testcontainers wiring).
      - name: Install modules the e2e tests depend on
        run: ./mvnw -B -ntp -pl app -am install -DskipTests

      - name: Browser E2E (Selenium, Chrome in a container)
        run: ./mvnw -B -ntp -pl e2e verify -Pe2e

      # The load scenario needs a RUNNING application, so the compose stack comes up first. The rate
      # limit is raised for exactly this run: POST /api/v1/validate allows 10/min per IP by default
      # and a load generator is one IP, so at the default the run would measure bucket4j. The
      # simulation asserts no request was refused, which is what makes this override mandatory rather
      # than a convenience.
      - name: Start the stack for the load run
        env:
          # The compose credentials are at job level (see above). Only the deliberate limit override
          # is scoped here, because it belongs to this one run and nothing else.
          RATE_LIMIT_VALIDATE_CAPACITY: "100000"
          RATE_LIMIT_VALIDATE_REFILL_PER_MINUTE: "100000"
        run: |
          set -euo pipefail
          docker compose up -d --build app
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Application healthy after ${i} attempts."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The application did not become healthy; dumping logs."
          docker compose logs app
          exit 1

      - name: Gatling load scenario (public validator)
        run: ./mvnw -B -ntp -pl e2e gatling:test -Pload -Dload.base-url=http://localhost:8080

      # MILESTONES M6: "Lighthouse >= 95 public". Run here rather than in its own job because the
      # compose stack is already up — a second job would stand the whole thing up again to load two
      # pages.
      #
      # Both public pages, all four categories, one threshold. The pages are built for this (no
      # framework, no external request, one hand-authored stylesheet, deferred first-party JS), so a
      # score below 95 means something regressed rather than that the bar is ambitious: measured
      # 100/100/100/100 on both pages at the time this job was added. The one real finding along the
      # way was an h1 -> h3 jump on the landing page's feature cards, which is a heading-order
      # violation assistive technology cares about and a reader cannot see.
      - name: Lighthouse (public pages, >= 95 in every category)
        env:
          # PINNED EXACTLY, not `lighthouse@12`. Every GitHub Action in this workflow is pinned to a
          # commit SHA; running whatever npm currently publishes for 12.x — on a runner holding
          # GITHUB_TOKEN, with `--yes` suppressing the one prompt that would ask — was the single
          # unpinned dependency left in the pipeline (M6 hostile review, F3). A version bump is now
          # a reviewable diff. `npx` still verifies the package against the registry; what changes
          # is that the pipeline no longer decides for itself which build to trust.
          LIGHTHOUSE_VERSION: 12.8.2
        run: |
          set -euo pipefail
          threshold=95
          status=0
          for path in "/" "/validator"; do
            # printf, not echo: `tr -c` translates every non-alphanumeric byte, and echo's trailing
            # NEWLINE is one of them. That is where the committed `lighthouse--.json` and
            # `lighthouse-validator-.json` got their names (M6 hostile review, F2).
            name="$(printf '%s' "$path" | tr -c 'a-zA-Z0-9' '-')"
            npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" "http://localhost:8080${path}" \
              --quiet --chrome-flags="--headless=new --no-sandbox" \
              --preset=desktop --output=json --output-path="lighthouse${name}.json"

            echo "Lighthouse ${path}"
            python3 scripts/lighthouse-check.py "lighthouse${name}.json" "$path" "$threshold" \
              || status=1
          done
          exit "$status"

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: lighthouse-*.json
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Upload E2E and Gatling reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-reports
          path: |
            e2e/target/failsafe-reports/
            e2e/target/gatling/
          retention-days: 14

  docker:
    name: Docker image build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the push on main; a pull request keeps the read-only default because the `if`
      # below skips the login and the push entirely.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-commit-id-maven-plugin runs INSIDE the image build (.git is part of the build
          # context on purpose — see .dockerignore) and needs real history for `git describe`-style
          # resolution. actions/checkout's default shallow clone is enough for the commit id itself,
          # but fetch-depth 0 removes the whole class of "works locally, empty in the image".
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Publishing happens on main only. A pull request still BUILDS the image — that is the check
      # worth having on every change — it simply does not push one.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags are published on every push to main, and they answer different questions.
      # `main` is what the deployment tracks, because the deploy webhook below can only say
      # "redeploy" — it cannot change which tag Dokploy pulls, so auto-deploy needs a moving tag.
      # `sha-<commit>` is immutable and is what you pin for a rollback or a frozen release
      # (docs/deployment-reference.md §4). "Which build is running" is therefore answered by
      # /actuator/info reporting its own commit, NOT by trusting the tag — which is what the
      # identity check below exists to guarantee.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must be able to say what it is, or "ask /actuator/info which commit is running"
      # is a procedure that cannot be followed — and with the deployment tracking a MOVING tag,
      # that endpoint is the only thing that answers it. This is cheap and it
      # catches the exact regression that would break it: `.git` slipping back into .dockerignore,
      # or the git-commit-id plugin losing its binding. It runs on pull requests too, where nothing
      # is pushed — the image is loaded locally for the check.
      - name: Build the image locally for the identity check
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: einvoice-at:ci-check
          cache-from: type=gha
      - name: The built image knows its own commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          # The jar is copied OUT and read on the runner rather than unzipped inside the container:
          # the runtime image is a JRE on Alpine and carries neither `unzip` nor `jar`, so an
          # in-container extraction would fail for a reason that has nothing to do with what is
          # being checked.
          container="$(docker create einvoice-at:ci-check)"
          docker cp "$container:/app/app.jar" /tmp/app.jar
          docker rm -f "$container" > /dev/null

          id="$(unzip -p /tmp/app.jar BOOT-INF/classes/git.properties 2>/dev/null \
                | sed -n 's/^git\.commit\.id=\([0-9a-f]\{40\}\)$/\1/p' || true)"
          echo "image reports commit: ${id:-<none>}"

          if [ -z "$id" ]; then
            echo "::error::The image contains no git.properties — /actuator/info cannot identify this build."
            echo "::error::Check that .dockerignore does not exclude .git and that git-commit-id-maven-plugin is bound."
            exit 1
          fi

          # Only a push event has a github.sha that is the commit actually built; a pull_request run
          # checks out a synthetic merge commit, so the equality half is meaningless there and
          # EXPECTED_SHA is deliberately empty. The presence half above — the one that guards
          # docs/deployment.md's "confirm the running commit with /actuator/info" — runs everywhere.
          if [ -n "$EXPECTED_SHA" ] && [ "$id" != "$EXPECTED_SHA" ]; then
            echo "::error::Image reports commit $id but this run built $EXPECTED_SHA."
            exit 1
          fi

  # Tells the Hetzner/Dokploy deployment to pull the image that was just published.
  #
  # Skipped LOUDLY when the webhook secret is absent, exactly like the NVD scan above: a fork, a
  # clone or a repository whose owner has not provisioned a VPS must not get a red pipeline for a
  # deployment it does not have, and a stage that is permanently red teaches everyone to ignore red.
  deploy:
    name: Deploy (Dokploy webhook)
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Dokploy deployment
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK is not set — NOTHING WAS DEPLOYED."
            {
              echo "## ℹ️ Deployment skipped"
              echo
              echo "\`DOKPLOY_DEPLOY_WEBHOOK\` is not configured, so this run published an image to"
              echo "GHCR and did **not** deploy it. See \`docs/deployment.md\` §11."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --fail so a 4xx/5xx from Dokploy is a failed job rather than a green one that deployed
          # nothing. The webhook itself is fire-and-forget; it does not report the rollout's outcome,
          # which is why the smoke test in docs/deployment.md §9 exists.
          curl --fail --silent --show-error --request POST "$WEBHOOK"
          echo "Deployment triggered for ${{ github.sha }}."
