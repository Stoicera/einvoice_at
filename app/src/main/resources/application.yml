spring:
  application:
    name: einvoice-at

  # Datasource is configured purely from environment variables (names aligned with the compose
  # POSTGRES_* set in .env.example); no credentials live in this file. The localhost/5432 defaults
  # only make a developer's `./mvnw spring-boot:run` reach a locally exposed Postgres — integration
  # tests override all of this via Testcontainers @ServiceConnection.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:einvoice}
    username: ${POSTGRES_USER:einvoice}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate must never mutate it, only confirm the mapping matches.
    hibernate:
      ddl-auto: validate
    # No open session in the view layer: transactions end at the service boundary.
    open-in-view: false

  flyway:
    enabled: true

  # Application-layer cap on POST /api/v1/validate uploads (SPEC section 4): 2 MB, well below the
  # validator's own defensive 20 MB guard (InvoiceValidator.MAX_INPUT_BYTES), so an oversized
  # upload is rejected by the servlet container — 413, before a byte reaches the controller — rather
  # than by the validator's internal XML-02 finding. Namespace verified against the Boot 4.1
  # spring-boot-servlet module's configuration metadata (MultipartProperties moved there in the 4.1
  # module split); both bounds are set so a request just under the file cap cannot slip through on
  # request overhead.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

# OAuth2 resource-server (Keycloak) settings, consumed by SecurityConfig's JwtDecoder. Both come
# from the environment; the compose stack sets OAUTH2_ISSUER_URI to the Keycloak realm. When an
# issuer is set, tokens must carry a matching `iss`. jwk-set-uri is derived from the issuer when
# left blank (Keycloak's standard certs path); override it only for a non-Keycloak JWKS layout. No
# defaults here, so a misconfigured deployment fails loudly rather than trusting the wrong issuer.
app:
  oauth2:
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
    # Optional audience check (`aud` must contain this value). Signature + issuer prove a token is
    # genuine, not that it was minted FOR this API — without this, any client in the realm can
    # present its own token and be authenticated. Left blank by default because a single-audience
    # dev realm needs no check and enabling it unconditionally would reject Keycloak's default
    # `account` audience; set it (to the API's client id) for any shared or production realm.
    # See ADR-0006 and JwtDecoderTest.
    audience: ${OAUTH2_AUDIENCE:}

  # Application-layer cap on any NON-multipart request body (RequestBodySizeLimitFilter). Multipart
  # uploads are bounded by spring.servlet.multipart.* above; nothing in Boot or Tomcat bounds an
  # ordinary body (server.tomcat.max-http-form-post-size is form-encoded only), and POST
  # /api/v1/invoices buffers its body whole. Same 2 MB bound as the multipart cap so "too big" means
  # one thing across the API, and both routes answer 413 content-too-large.
  limits:
    max-request-body-size: ${MAX_REQUEST_BODY_SIZE:2MB}

  # Cap on the number of ACTIVE (non-revoked) API keys one tenant may hold. Minting was unbounded
  # before the M3 hostile review. Revoked keys keep their rows for the audit trail but do not count,
  # so a tenant at the cap makes room by revoking rather than by losing history.
  api-keys:
    max-active-per-tenant: ${API_KEYS_MAX_ACTIVE_PER_TENANT:25}

  # Per-IP rate limiting on the anonymous side of POST /api/v1/validate only (SecurityConfig wires
  # RateLimitFilter; SPEC section 4). A fresh IP starts with `capacity` tokens and regenerates
  # `refill-per-minute` tokens every 60s (bucket4j "greedy" refill — spread evenly across the
  # minute, not released in one lump). Defaults are deliberately generous for a portfolio demo, not
  # tuned against real traffic. Test contexts override both (AbstractKeycloakIT raises the shared
  # ITs' capacity so their handful of anonymous /validate calls never collide with this limit;
  # RateLimitIT lowers it in its own dedicated context to exercise the 429 path).
  rate-limit:
    validate:
      capacity: ${RATE_LIMIT_VALIDATE_CAPACITY:10}
      refill-per-minute: ${RATE_LIMIT_VALIDATE_REFILL_PER_MINUTE:10}
    # POST /api/v1/convert, limited per CREDENTIAL rather than per IP, and applied to authenticated
    # callers too — that endpoint requires authentication, so an authenticated bypass would leave a
    # limit covering nobody. It went unlimited until the M4 hostile review (finding F9) despite
    # being the most expensive operation in the platform: a read, two mappings, a write, and a full
    # Peppol XSLT validation of the result. Lower than the validate allowance for exactly that
    # reason. Generous for a portfolio demo, not tuned against real traffic.
    convert:
      capacity: ${RATE_LIMIT_CONVERT_CAPACITY:20}
      refill-per-minute: ${RATE_LIMIT_CONVERT_REFILL_PER_MINUTE:20}
    # POST /api/v1/reports/{id}/explain and the dashboard's per-finding "Erklären" — the two routes
    # where a request becomes a PAID third-party call. Limited per credential and applied to
    # authenticated callers too, exactly like convert: both routes require authentication, so an
    # authenticated exemption would leave a limit covering nobody. They share one bucket because
    # they buy the same thing from the same provider, and it is a bucket of its own so that spending
    # the explanation allowance never stops a tenant validating (which costs CPU, not money).
    #
    # The M5 hostile review (F4) found both unlimited: app.ai.max-findings-per-request bounds one
    # request, and nothing bounded the rate. Lower than the others on purpose — this is the only
    # limit here whose unit is euros. The public /validator/erklaeren keeps the anonymous-only
    # validate policy instead; it is a different threat (abuse of a free endpoint).
    explain:
      capacity: ${RATE_LIMIT_EXPLAIN_CAPACITY:30}
      refill-per-minute: ${RATE_LIMIT_EXPLAIN_REFILL_PER_MINUTE:30}

  # Storage limitation (GDPR Art. 5(1)(e)) — RetentionService, scheduled by PrivacyConfig.
  #
  # ZERO OR NEGATIVE MEANS KEEP FOREVER. That is the off switch; there is deliberately no separate
  # `enabled` flag, because two mechanisms can disagree and one cannot.
  #
  # INVOICES ARE NOT LISTED HERE ON PURPOSE and no window will ever expire them: an Austrian business
  # must keep its invoices for seven years (§ 132 BAO). Deleting them automatically would destroy
  # records the user is legally required to hold. Erasure on request (DELETE /api/v1/tenant) is a
  # different operation and does delete them, because the person asked.
  retention:
    # A validation verdict is operational output — reproducible by re-validating, and unread after a
    # year.
    report-days: ${RETENTION_REPORT_DAYS:365}
    # The security trail: useful for months, and the fastest-growing table in the schema.
    audit-days: ${RETENTION_AUDIT_DAYS:730}
    # Daily, at a quiet hour in the server's zone. A purge is a bulk delete over an indexed timestamp,
    # so it is short even on a large table.
    cron: ${RETENTION_CRON:0 15 3 * * *}

  # AI-assisted finding explanations (SPEC §6, ADR-0010). Only read when the feature flag below is on;
  # AiConfig contributes no beans at all otherwise, so an unset AI_API_KEY is not a problem until
  # someone switches the feature on — at which point the context fails to start and says so, rather
  # than booting a client that cannot work.
  ai:
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:anthropic/claude-sonnet-5}
    timeout: ${AI_TIMEOUT:15s}
    max-retries: ${AI_MAX_RETRIES:1}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:700}
    # How many findings ONE POST /api/v1/reports/{id}/explain may explain, errors first. Unlike the
    # keys above this one is read whether or not the feature is on (ReportExplanationService exists
    # either way, so it can answer 503 rather than 404). A Peppol report can carry dozens of findings
    # and each distinct one is a paid provider call, so "explain everything" without a bound would
    # turn a single request into an unbounded bill; findings past the cap keep a null explanation,
    # which is already what that field's absence means. Pass ?findingIndex=N to explain exactly one.
    max-findings-per-request: ${AI_MAX_FINDINGS_PER_REQUEST:10}

# Feature flags. SPEC §2 names this one: "ai-assist is only called from app behind the feature flag
# features.ai-explanations".
#
# DEFAULT OFF, deliberately. The feature costs money per click and sends text to a third party; that
# is something an operator switches on knowingly, not something they discover in an invoice. With it
# off the platform is complete: the validator, the reports and the API are unchanged, and the
# "Erklären" buttons are simply not rendered (M5 Abnahme: "KI abschaltbar ohne Funktionsverlust").
features:
  ai-explanations: ${FEATURES_AI_EXPLANATIONS:false}

# OpenAPI document and Swagger UI. Both are served anonymously (SecurityConfig permits them), which
# is right for a portfolio/dev instance and a decision that deserves an off-switch rather than a
# default nobody chose — springdoc itself warns on every boot when they are left on. One flag drives
# both, so the document and the UI can never disagree about being exposed. Set API_DOCS_ENABLED=false
# on any deployment that should not publish its full API description to anonymous callers.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

server:
  port: 8080
  # WHO THE CLIENT IS, BEHIND A REVERSE PROXY. Default `none`, and that is the safe direction: with
  # this off, the request's remote address is whatever TCP peer connected, which behind Traefik is
  # Traefik. Switch it to `framework` on a deployment that genuinely sits behind a trusted proxy
  # (docs/deployment.md does exactly that for the Dokploy/Traefik target) and Spring's
  # ForwardedHeaderFilter rewrites the request from X-Forwarded-For/-Proto/-Host.
  #
  # THIS IS A SECURITY SETTING IN BOTH DIRECTIONS, which is why it is a knob and not a constant:
  #   * left off behind a proxy, every anonymous caller shares one apparent IP — so the per-IP rate
  #     limit on POST /api/v1/validate becomes a single global bucket, and one abusive client
  #     rate-limits the entire internet. It also makes {@code https://} redirects come out as http.
  #   * turned on WITHOUT a proxy, X-Forwarded-For is caller-supplied text, so anyone can claim any
  #     address and mint themselves an unlimited number of rate-limit buckets.
  # There is no value that is right in both topologies, so the deployment states which one it is.
  # RateLimitFilter's Javadoc records the same trade-off from the limiter's side.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Actuator surface. `metrics` is exposed alongside the probes because M5 ships cost metrics
# (einvoice.ai.calls / .tokens / .cost.usd) and a metric an operator cannot read is not a metric —
# the M5 hostile review (F5) found all three recorded into a registry with no endpoint in front of
# it. All of /actuator/** except the health probes requires authentication (SecurityConfig), so this
# publishes nothing anonymously.
#
# There is deliberately NO /actuator/prometheus. M6 exports both metrics and traces over OTLP (see
# below), which is one mechanism instead of two and adds no endpoint that a scraper would need a
# credential for. ENGINEERING_STANDARDS §5 names OTLP export as an acceptable shape; ADR-0012
# records the choice and what it costs.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

  # /actuator/info — which build is this? SPEC §9 asks for "git sha + build time", carried as an open
  # item since M4. Both come from files the build writes: git.properties (git-commit-id-maven-plugin)
  # and build-info.properties (spring-boot-maven-plugin's build-info goal). Neither exists in a plain
  # `mvn test` run against exploded classes, and Boot simply omits the section then rather than
  # failing — so this is safe in every environment and only *populated* in a real build.
  #
  # `full` publishes every key git.properties contains — and that is safe here precisely because
  # the POM's includeOnlyProperties has already reduced that file to three: the commit id, its
  # abbreviation and the commit time. No branch, no committer name or e-mail address, no commit
  # message. ONE filter, in the place that writes the file, rather than a second one here that
  # could disagree with it.
  #
  # `simple` was tried first and is wrong for this purpose: it publishes `commit.id` with the
  # ABBREVIATED value, and a 7-character prefix is a hash that can collide — the whole point of the
  # endpoint is to be able to check out exactly the tree that is running. BuildInfoEndpointIT is
  # what found that, by asserting the shape of the id rather than merely its presence.
  info:
    git:
      mode: full
    build:
      enabled: true
    # No environment properties. /actuator/info answers "which build is this?"; it is not a
    # configuration dump, and this application's environment carries database and OAuth2 settings.
    env:
      enabled: false

  # ---------------------------------------------------------------------------------------------
  # OpenTelemetry (M6, ADR-0012). Traces AND metrics, both pushed over OTLP.
  #
  # OFF BY DEFAULT, AND THAT DEFAULT IS LOAD-BEARING. Boot's own defaults for both exporters are
  # "enabled, endpoint http://localhost:4318/…", so leaving them alone would make every deployment
  # that never asked for observability POST spans and metrics into a socket nobody is listening on,
  # forever, and log the failures. `OTEL_ENABLED=false` gates both, so the exporters are constructed
  # but never publish; `docker compose --profile observability up` is what turns them on.
  #
  # Note what is NOT gated: the ObservationRegistry, and therefore every span this application
  # creates. Instrumentation has one shape in every deployment — see ObservabilityConfig for why
  # a conditional object graph would be worse than a conditional exporter.
  tracing:
    enabled: ${OTEL_ENABLED:false}
    # BOTH flags, and the second one is not redundant — that was measured, not assumed.
    #
    # `tracing.enabled: false` removes the Tracer and stops spans being RECORDED. It does not stop
    # the OTLP span EXPORTER from being built, because that is gated on `tracing.export.enabled`
    # (Boot's default: true) plus a configured endpoint — and this file configures one. The result
    # was an application with tracing switched off that still opened a connection to `tempo:4318`
    # and logged "Failed to export spans" on shutdown. The E2E run is what showed it: that hostname
    # resolves only inside the compose network, so on a developer's machine it fails loudly.
    export:
      enabled: ${OTEL_ENABLED:false}
    sampling:
      # A ratio, not a switch. 1.0 in the local compose profile because a portfolio stack has no
      # traffic to sample away and a half-sampled demo trace is a confusing demo; a real deployment
      # lowers it. Boot's own default is 0.1.
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://tempo:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_METRICS_ENDPOINT:http://prometheus:9090/api/v1/otlp/v1/metrics}
        step: ${OTEL_METRICS_STEP:15s}

  # Percentile histograms for the three meters a latency panel is ever drawn from.
  #
  # WITHOUT THIS, A p95 IS NOT MERELY IMPRECISE — IT IS UNCOMPUTABLE. A Micrometer timer publishes
  # count, sum and max by default and no bucket boundaries at all, so Prometheus receives a single
  # `+Inf` bucket and `histogram_quantile` answers NaN for every quantile, forever. The Grafana
  # dashboard's latency panels were written before this was set and showed exactly that: six named
  # series, every value NaN. Measured on the running stack, not reasoned about.
  #
  # Bounded on both ends deliberately. Micrometer's unbounded default generates ~70 buckets per
  # meter, which is 70 series per tag value — and these meters are tagged by stage and by step. A
  # 1 ms floor and a 10 s ceiling cover the real range (a Peppol XSLT run is the slow end, at
  # hundreds of milliseconds) and cut the bucket count to a fraction of that.
  #
  # Tied to OTEL_ENABLED for the same reason as the exporters: with observability off there is no
  # collector to send buckets to, and computing them would be work whose output nothing reads.
  metrics:
    distribution:
      percentiles-histogram:
        einvoice.validation.stage: ${OTEL_ENABLED:false}
        einvoice.pipeline: ${OTEL_ENABLED:false}
        http.server.requests: ${OTEL_ENABLED:false}
      minimum-expected-value:
        einvoice.validation.stage: 1ms
        einvoice.pipeline: 1ms
        http.server.requests: 1ms
      maximum-expected-value:
        einvoice.validation.stage: 10s
        einvoice.pipeline: 10s
        http.server.requests: 10s

# Security-relevant events (a rejected API key, a rate-limited caller, an oversized body, a
# provisioned tenant, an unhandled 500) are logged by the classes that produce them; this only
# guarantees the category is not filtered out. Hibernate's own WARN for a constraint violation the
# application handles deliberately — the (tenant, invoiceNumber) duplicate translated into a 409,
# and the tenant-provisioning race resolved by design — is quietened to ERROR, so a WARN in this
# application's log stays a signal rather than expected noise.
logging:
  level:
    com.stoicera.einvoice: INFO
    org.hibernate.orm.jdbc.error: ERROR

---
# Production logging: structured JSON on stdout (ENGINEERING_STANDARDS §5), ECS field names so a
# Grafana/Loki or Elastic pipeline can read it without a custom parser. Local development and the
# integration tests keep the human-readable default — nothing activates this profile except a
# deployment setting SPRING_PROFILES_ACTIVE=prod (M6, and docs/deployment.md sets it).
#
# LOG-TO-TRACE CORRELATION COMES FREE HERE and is worth saying out loud, because it is the whole
# reason JSON logs and OTel traces are worth having together: micrometer-tracing puts `traceId` and
# `spanId` into the SLF4J MDC for the duration of every span, and Boot's ECS format writes the MDC
# out as top-level fields. So a log line emitted anywhere inside a request carries the id of the
# trace it belongs to, and Grafana links from the line straight to the waterfall. Nothing below
# configures that; it is a consequence of the two features being on at once, and it stops working
# silently if either is removed.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: einvoice-at
