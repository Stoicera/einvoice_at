services:
  app:
    build: .
    image: einvoice-at:local
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-einvoice-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einvoice} -d ${POSTGRES_DB:-einvoice}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
