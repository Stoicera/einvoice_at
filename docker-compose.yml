services:
  app:
    build: .
    image: einvoice-at:local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Datasource resolves from POSTGRES_* (see application.yml). Inside the compose network the
      # database is reachable at host `postgres` on its internal port 5432; credentials come from
      # .env. No secrets are hard-coded here.
      # Overridable, but blank in .env means this default — see .env.example.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a generated value}
      # OAuth2 resource server. Two URLs on purpose (the classic Docker split): tokens carry the
      # issuer clients see from the host (localhost:${KEYCLOAK_PORT}), while the app fetches the
      # signing keys over the compose network at `keycloak:8080`. SecurityConfig validates `iss`
      # against OAUTH2_ISSUER_URI and pulls JWKS from OAUTH2_JWK_SET_URI, so the two never have to be
      # the same host.
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:${KEYCLOAK_PORT:-8081}/realms/einvoice}
      OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/realms/einvoice/protocol/openid-connect/certs}
      # Optional audience check, blank by default for the dev realm (see .env.example / ADR-0006).
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
      # OpenAPI document + Swagger UI. On for the local stack; a deployment that should not publish
      # its API description to anonymous callers sets this to false.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Bounds and limits. THESE WERE DOCUMENTED IN .env.example AND NOT PASSED THROUGH HERE, which
      # meant setting any of them in .env did exactly nothing — silently, which is the worst way for a
      # configuration knob to be broken. Found by the Gatling run: it raised
      # RATE_LIMIT_VALIDATE_CAPACITY, got 36 rate-limited requests out of 50 anyway, and the
      # simulation's "no request may be refused" assertion turned that into a failure instead of a
      # meaningless p95. Every variable .env.example documents for the app now appears here; a CI
      # check asserts the two lists agree.
      RATE_LIMIT_VALIDATE_CAPACITY: ${RATE_LIMIT_VALIDATE_CAPACITY:-10}
      RATE_LIMIT_VALIDATE_REFILL_PER_MINUTE: ${RATE_LIMIT_VALIDATE_REFILL_PER_MINUTE:-10}
      RATE_LIMIT_CONVERT_CAPACITY: ${RATE_LIMIT_CONVERT_CAPACITY:-20}
      RATE_LIMIT_CONVERT_REFILL_PER_MINUTE: ${RATE_LIMIT_CONVERT_REFILL_PER_MINUTE:-20}
      RATE_LIMIT_EXPLAIN_CAPACITY: ${RATE_LIMIT_EXPLAIN_CAPACITY:-30}
      RATE_LIMIT_EXPLAIN_REFILL_PER_MINUTE: ${RATE_LIMIT_EXPLAIN_REFILL_PER_MINUTE:-30}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-2MB}
      API_KEYS_MAX_ACTIVE_PER_TENANT: ${API_KEYS_MAX_ACTIVE_PER_TENANT:-25}
      # Retention windows (GDPR Art. 5(1)(e)). Zero or negative means keep forever; invoices are never
      # expired by the job at all (§ 132 BAO). See RetentionService.
      RETENTION_REPORT_DAYS: ${RETENTION_REPORT_DAYS:-365}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-730}
      RETENTION_CRON: ${RETENTION_CRON:-0 15 3 * * *}
      # Browser login for the M5 web UI (OAuth2 authorization-code flow). The same Docker split as
      # the resource server above, and here it is unavoidable rather than merely convenient: the
      # BROWSER must be sent to a URL it can reach (localhost:${KEYCLOAK_PORT}), while the app
      # exchanges the code and fetches keys over the compose network (keycloak:8080). Discovery from
      # a single issuer-uri cannot satisfy both, so the four URLs are given explicitly — the
      # authorization URL browser-facing, the rest app-facing.
      #
      # DO NOT ADD `..._PROVIDER_KEYCLOAK_ISSUER_URI` HERE. It reads as the harmless completion of
      # this block and it is not: Spring Boot treats a provider `issuer-uri` as a request to perform
      # OIDC DISCOVERY at startup (ClientRegistrations.fromIssuerLocation), which overrides the point
      # of listing the endpoints explicitly and fetches
      # `<issuer>/.well-known/openid-configuration` from inside this container. The browser-facing
      # value is `localhost:${KEYCLOAK_PORT}`, and inside the container that is the container's own
      # loopback — connection refused, bean creation fails, and the WHOLE APPLICATION fails to start,
      # public validator included. It was set here once and did exactly that; the compose stack could
      # not boot. Pinned KC_HOSTNAME (see the keycloak service) is what keeps `iss` trustworthy
      # without discovery.
      #
      # Leave SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID empty to run with no
      # login at all: the public validator still works and /app/** is refused.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: ${OAUTH2_CLIENT_ID:-einvoice-web}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-dev-einvoice-web-secret-not-for-production}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME: Keycloak
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_PROVIDER: keycloak
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: "{baseUrl}/login/oauth2/code/{registrationId}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/einvoice/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/einvoice/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/einvoice/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/einvoice/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username
      # AI-assisted finding explanations (SPEC §6, ADR-0010). Off unless .env says otherwise; with the
      # flag on and no key the app refuses to start rather than pretending the feature works.
      FEATURES_AI_EXPLANATIONS: ${FEATURES_AI_EXPLANATIONS:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
      AI_TIMEOUT: ${AI_TIMEOUT:-15s}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-700}
      AI_MAX_FINDINGS_PER_REQUEST: ${AI_MAX_FINDINGS_PER_REQUEST:-10}
      # Observability (M6, ADR-0012). OFF unless asked for: with OTEL_ENABLED false the exporters
      # are built and never publish, so a stack started without the observability backends does not
      # spend a request thread posting spans into a socket nobody is listening on.
      #
      # THE PROFILE DOES NOT TURN THIS ON BY ITSELF, and pretending otherwise would be the kind of
      # silent-no-op this repository has now been bitten by twice (the RATE_LIMIT_* family in M5).
      # A compose profile decides which SERVICES start; it cannot set an environment variable on a
      # service that is already running. So the observability stack is one command with the flag
      # given explicitly:
      #
      #     OTEL_ENABLED=true docker compose --profile observability up -d
      #
      # or `OTEL_ENABLED=true` in .env, which is what .env.example documents.
      #
      # The two endpoints point at compose service names, which is why they are defaulted here
      # rather than left to application.yml alone: those defaults (`tempo`, `prometheus`) only
      # resolve inside this network, and a deployment elsewhere sets its own.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      OTEL_METRICS_STEP: ${OTEL_METRICS_STEP:-15s}
      # Reverse-proxy awareness. `none` locally, because nothing sits in front of this container and
      # trusting X-Forwarded-For without a proxy lets any caller claim any IP — and therefore mint
      # itself an unlimited number of rate-limit buckets. docs/deployment.md sets `native` for the
      # Traefik/Dokploy target, where the opposite failure applies: without it every anonymous
      # caller shares Traefik's address and the per-IP limit becomes one global bucket.
      #
      # `native` and NOT `framework`: a proxy appends to X-Forwarded-For, so the rightmost entry is
      # the only trustworthy one, and Spring's ForwardedHeaderFilter (the `framework` strategy)
      # reads the leftmost. See application.yml and docs/deployment.md §4 (M6 review, F1).
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-einvoice}
      POSTGRES_USER: ${POSTGRES_USER:-einvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a generated value}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einvoice} -d ${POSTGRES_DB:-einvoice}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity provider. Dev mode with realm auto-import; the einvoice realm ships a confidential
  # client (direct access grants on, for dev/test token fetching) and one test user — every
  # credential in keycloak/dev-realm.json is dev-only. The admin bootstrap credentials are required
  # from .env (no defaults), like POSTGRES_PASSWORD.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required — copy .env.example to .env and set a value}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required — copy .env.example to .env and set a generated value}
      # Expose the health endpoints on the management port (9000) for the healthcheck below.
      KC_HEALTH_ENABLED: "true"
      # PIN THE ISSUER. Without this, `start-dev` derives every URL — including the `iss` claim it
      # stamps into tokens — from the incoming request's Host header, so the same realm calls itself
      # `http://localhost:8081/realms/einvoice` to the browser and `http://keycloak:8080/realms/einvoice`
      # to the app over the compose network. The two channels then disagree about who the issuer is:
      # a browser login's id_token is minted over the BACK channel and would carry `keycloak:8080`,
      # while OAUTH2_ISSUER_URI below (and every API token fetched from the host) says `localhost:8081`.
      # Pinning the frontend URL makes `iss` one value on both channels, which is what lets the app
      # validate it at all. Backchannel stays dynamic so the app can still reach the token, JWKS and
      # userinfo endpoints by their compose-network name.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      # Keycloak's directory import requires the file to be named <realm>-realm.json, so the repo's
      # keycloak/dev-realm.json is mounted into the import directory as einvoice-realm.json.
      - ./keycloak/dev-realm.json:/opt/keycloak/data/import/einvoice-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # The Keycloak image ships bash (with /dev/tcp) but no curl/wget, so the readiness probe is a
      # raw HTTP GET to the management health endpoint over a bash TCP socket. /health/ready returns
      # 200 only once the server is up and the realm import has finished.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Local SMTP sink. Joins the stack now per the M0 decision "Keycloak/Mailpit join at M3"; it is not
  # wired to the app yet — the notification flow that sends through it arrives in M5.
  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # The `observability` profile (ENGINEERING_STANDARDS §5, MILESTONES M6, ADR-0012).
  #
  #     OTEL_ENABLED=true docker compose --profile observability up -d
  #
  # Three containers and no OpenTelemetry Collector: the application speaks OTLP directly to both
  # backends, so a Collector would be a fourth process whose only job is forwarding. A real
  # deployment that wants tail sampling, redaction or fan-out adds one — docs/deployment.md says so
  # — but a portfolio stack that starts in one command is worth more than a complete reference
  # architecture nobody runs.
  #
  # None of these three is exposed beyond 127.0.0.1, and none of them authenticates anything. They
  # are a local development aid; docs/deployment.md deliberately does NOT deploy them.

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:6573196e5dbe834779ac4d34cb053113cc502a69e9e20ba3be96d37f33e81545
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Metrics arrive by OTLP push, not by scraping. Without this flag the receiver route does not
      # exist and every export answers 404 — silently, from the application's point of view.
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.1@sha256:1c32b96d2397cd134e908214d1ddfa6037e85798ed62f6c239e90213299cc15d
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    # The image runs as uid 10001 and a freshly created named volume is owned by root, so Tempo
    # cannot create its WAL directory on first start. Running as root is the usual workaround and is
    # acceptable *here* — this is a development-only profile on a loopback-bound port that
    # docs/deployment.md deliberately does not deploy. Stated rather than left as an unexplained
    # privilege in a compose file, because it is exactly the line a reviewer stops at.
    user: root
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      # 3200 is Tempo's query API (Grafana reads it); 4318 is the OTLP/HTTP receiver the app writes
      # to. Both bound to loopback — nothing here authenticates.
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1@sha256:7c064e627d9cb50c3485c9ded5ca0222de89a08e41403322a0c3ca6f1777a8d1
    profiles: [observability]
    depends_on: [prometheus, tempo]
    environment:
      # Anonymous admin, deliberately: this Grafana holds nothing but this stack's own numbers, and
      # a login prompt in front of a demo dashboard is friction with no security value. It is bound
      # to loopback (below) and docs/deployment.md does not deploy it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/einvoice-at.json:/etc/grafana/provisioning/dashboards/einvoice-at.json:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  tempodata:
